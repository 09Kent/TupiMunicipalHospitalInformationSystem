services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmhis_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Tupi Municipal Hospital"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      APP_KEY: "base64:Oy2l894Wjpwn+OXwBteqRXFQhaEtUtNILT4tSF8mB2Y="
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: MedicalRegistrationDB
      DB_USERNAME: root
      DB_PASSWORD: root_password
      SESSION_DRIVER: file
      CACHE_STORE: file
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./public:/var/www/html/public
      - ./database:/var/www/html/database
      - storage_data:/var/www/html/storage

  db:
    image: mysql:8.4
    container_name: tmhis_db
    restart: unless-stopped
    command: --mysql-native-password=ON
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: MedicalRegistrationDB
    volumes:
      - db_data:/var/lib/mysql
      - ./database/sql/register_schema.sql:/docker-entrypoint-initdb.d/01_register_schema.sql:ro
      - ./database/sql/doctor_schema.sql:/docker-entrypoint-initdb.d/02_doctor_schema.sql:ro
      - ./database/sql/tmhis_master_schema.sql:/docker-entrypoint-initdb.d/03_master_schema.sql:ro
      - ./database/sql/comprehensive_seed.sql:/docker-entrypoint-initdb.d/04_comprehensive_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: tmhis_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  db_data:
  storage_data:
